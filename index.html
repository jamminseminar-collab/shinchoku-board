<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>進み具合ボード</title>
<meta name="theme-color" content="#070d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="進み具合">
<link rel="apple-touch-icon" href="icon-metal-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 方針：深い墨色のヒーローに大きな日付、下は静かなカードの一覧。アクセントは翡翠色ひとつ */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface-2:#f6f8f7; --line:#e3e8e6; --ring:#b9c4c0; --fg:#14201c; --muted:#6a7773;
  --ink-1:#0e1d1a; --ink-2:#1b3a33; --ink-fg:#eaf4f1; --ink-muted:#9fbdb4;
  --accent:#17a07c; --accent-strong:#0f7d61; --accent-ink:#ffffff; --accent-soft:#dff3ec;
  --hon:#2f5fb8; --hon-soft:#e5ecfa; --fuku:#b8601c; --fuku-soft:#fbeee2; --warn:#c6362a; --warn-soft:#fde8e5;
  --shadow:0 1px 2px rgba(16,32,28,.05),0 6px 18px rgba(16,32,28,.06);
  --font:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --num:"Outfit","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media all{:root{
  --bg:#0b1311; --surface:#141e1b; --surface-2:#18241f; --line:#22312c; --ring:#46584f; --fg:#e6efec; --muted:#8fa29c;
  --ink-1:#0f2a24; --ink-2:#1d4a40; --ink-fg:#eaf4f1; --ink-muted:#a7c7bd;
  --accent:#3fc9a2; --accent-strong:#3fc9a2; --accent-ink:#06231b; --accent-soft:#16352d;
  --hon:#93b4f2; --hon-soft:#1b2843; --fuku:#f0a76b; --fuku-soft:#3a2716; --warn:#ff8b7c; --warn-soft:#3b1d19;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
button:disabled{opacity:.45}

/* ヒーロー */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px 20px 20px;color:var(--ink-fg);
  background:radial-gradient(120% 90% at 100% 0%,var(--ink-2) 0%,transparent 60%),linear-gradient(160deg,var(--ink-2) 0%,var(--ink-1) 70%);
  box-shadow:0 10px 30px rgba(14,29,26,.25)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;
  border:28px solid rgba(255,255,255,.04)}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--ink-muted)}
.icons{display:flex;gap:4px;position:relative;z-index:1}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-fg);background:rgba(255,255,255,.08)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--accent);color:var(--accent-ink)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-date{display:flex;align-items:flex-end;gap:14px;margin-top:6px}
.day{font-family:var(--num);font-weight:800;font-size:72px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-date .meta{padding-bottom:6px}
.month{font-size:14px;color:var(--ink-muted);font-weight:700}
.hero-msg{font-size:18px;font-weight:900;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column}
.stat b{font-family:var(--num);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-muted);font-weight:700}
.stat.hot b{color:#7ff0cc}

/* タブ */
.tabs{display:flex;background:var(--surface);border-radius:16px;padding:4px;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:9px 0;border-radius:12px;font-weight:700;color:var(--muted);font-size:15px;transition:background .2s,color .2s}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* 一覧 */
#groups{display:flex;flex-direction:column;gap:26px}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-size:15px;font-weight:900;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:.04em}
.group h2 small{font-family:var(--num);font-size:12px;font-weight:700;min-width:22px;height:22px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.hint{font-size:13px;color:var(--muted);margin-top:-4px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);transition:opacity .3s}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ring);background:var(--surface);display:grid;place-items:center;margin-top:-3px;transition:background .2s,border-color .2s,transform .15s}
.check:active{transform:scale(.9)}
.check svg{width:16px;height:16px;opacity:0}
.row.checked .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row.checked .check svg{opacity:1}
.row.checked .ttl{color:var(--muted);text-decoration:line-through}
.row.checked{opacity:.7}
.mark{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);margin-top:-3px}
.mark svg{width:16px;height:16px}
.body{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.body.tap{cursor:pointer}
.ttl{overflow-wrap:anywhere;font-weight:700;line-height:1.5}
.sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tag{font-weight:700;border-radius:6px;padding:1px 8px}
.tag.hon{background:var(--hon-soft);color:var(--hon)} .tag.fuku{background:var(--fuku-soft);color:var(--fuku)}
.tag.due{background:var(--warn-soft);color:var(--warn)}
.tag.stage{background:var(--surface-2);color:var(--muted)}
.go{align-self:flex-start;margin-top:2px;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-strong);text-decoration:none;padding:7px 14px;border-radius:999px}
.empty{font-size:14px;color:var(--muted);padding:16px;border:1.5px dashed var(--line);border-radius:18px;text-align:center}
.toggle{font-size:14px;font-weight:700;color:var(--muted);text-align:left;padding:4px 2px}
.legend{display:none}
.note{font-size:12px;color:var(--muted);text-align:center}
.note.err{color:var(--warn)}

/* ログイン */
.login{background:var(--surface);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;text-align:center;box-shadow:var(--shadow)}
.login p{margin:0;color:var(--muted);font-size:15px}
.btn-main{background:var(--accent-strong);color:var(--accent-ink);font-weight:700;padding:14px;border-radius:14px;font-size:16px}
.btn-sub{background:var(--surface-2);font-weight:700;padding:14px;border-radius:14px}

/* 追加ボタンと入力シート */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:62px;height:62px;border-radius:20px;background:linear-gradient(150deg,var(--accent),var(--accent-strong));color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 24px rgba(15,125,97,.35)}
.fab svg{width:28px;height:28px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;z-index:5}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{margin:0;font-size:17px;font-weight:900}
.sheet input{font:inherit;font-size:16px;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg)}
.kinds{display:flex;gap:8px}
.kinds button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;color:var(--muted);background:var(--surface)}
.kinds button[aria-pressed="true"][data-k="本業"]{border-color:var(--hon);color:var(--hon);background:var(--hon-soft)}
.kinds button[aria-pressed="true"][data-k="副業"]{border-color:var(--fuku);color:var(--fuku);background:var(--fuku-soft)}
.kinds button[aria-pressed="true"][data-w]{border-color:var(--accent-strong);color:var(--accent-strong);background:var(--accent-soft)}
.sheet-acts{display:flex;gap:8px}
.sheet-acts button{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:var(--ink-1);color:var(--ink-fg);
  padding:10px 8px 10px 16px;border-radius:14px;font-size:15px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);z-index:6;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.toast button{color:#7ff0cc;font-weight:700;padding:4px 10px}
.foot{display:flex;justify-content:center}
.foot button{font-size:12px;color:var(--muted);text-decoration:underline;padding:6px}

/* ===== シルバー×ネイビー仕上げ ===== */
:root{ --bg:#e9ecf0; --surface:#fbfcfd; --surface-2:#eef1f5; --line:#d8dde4; --ring:#a9b3c0; --fg:#101a2e; --muted:#5f6b7d;
  --navy-1:#0a1630; --navy-2:#1a2f5c; --accent:#1f3d7a; --accent-strong:#1a3368; --accent-ink:#ffffff; --accent-soft:#e3e9f5;
  --silver:linear-gradient(180deg,#ffffff 0%,#e3e8ee 38%,#9aa5b2 54%,#d3dae2 72%,#f7f9fb 100%);
  --silver-line:linear-gradient(90deg,transparent,#c9d1db 25%,#ffffff 50%,#c9d1db 75%,transparent);
  --card-grad:linear-gradient(180deg,#ffffff 0%,#f2f4f7 100%); --edge:rgba(255,255,255,.95) }
@media all{:root{ --bg:#070d1a; --surface:#0f1a30; --surface-2:#14213b; --line:#1f2f4f; --ring:#4a5d80; --fg:#e8edf5; --muted:#8e9bb3;
  --navy-1:#0b1730; --navy-2:#1d3566; --accent:#c8d2e0; --accent-strong:#c8d2e0; --accent-ink:#0a1630; --accent-soft:#1b2a48;
  --hon:#9db8f2; --hon-soft:#16264a; --card-grad:linear-gradient(180deg,#111d35 0%,#0c1629 100%); --edge:rgba(255,255,255,.05); color-scheme:dark }}
body{background:radial-gradient(140% 520px at 50% -10%,var(--surface-2) 0%,transparent 100%) no-repeat,var(--bg)}
.hero{background:
   radial-gradient(120% 90% at 100% 0%,rgba(120,150,210,.28) 0%,transparent 55%),
   linear-gradient(155deg,var(--navy-2) 0%,var(--navy-1) 75%);
  border:1px solid rgba(200,210,224,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 16px 36px rgba(10,22,48,.35)}
.hero::before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--silver-line);opacity:.8}
.hero::after{border-color:rgba(200,210,224,.06)}
.brand{color:#b8c3d4;letter-spacing:.26em}
.day{background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.month{color:#a9b6ca}
.hero-msg{color:#f3f6fa}
.iconbtn{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(200,210,224,.25);color:#e6ebf2}
.iconbtn.on{background:var(--silver);color:#0a1630}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid rgba(200,210,224,.18)}
.stat span{color:#a9b6ca}
.stat.hot b{background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{background:var(--card-grad);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge)}
.tabs button[aria-pressed="true"]{background:linear-gradient(180deg,#24427f,#0f2044);color:#f3f6fa;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.group h2 small{background:linear-gradient(180deg,#2a4a8a,#122550);color:#f3f6fa}
.row{background:var(--card-grad);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge),0 1px 2px rgba(10,22,48,.05),0 8px 20px rgba(10,22,48,.06)}
.check{background:var(--surface)}
.row.checked .check{background:linear-gradient(180deg,#2a4a8a,#0f2044);border-color:#0f2044;color:#fff}
.mark{color:var(--accent)}
.go{background:linear-gradient(180deg,#2c4f94 0%,#173068 60%,#0f2148 100%);color:#fff;border:1px solid rgba(0,0,0,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 10px rgba(10,22,48,.2)}
.fab{background:linear-gradient(180deg,#f7f9fb 0%,#c3ccd7 50%,#8f9bab 100%);color:#0a1630;border:1px solid rgba(255,255,255,.6);
  box-shadow:inset 0 1px 0 #fff,0 12px 26px rgba(10,22,48,.3)}
.btn-main{background:linear-gradient(180deg,#2c4f94 0%,#173068 60%,#0f2148 100%)}
.kinds button[aria-pressed="true"][data-w]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sheet{background:var(--card-grad)}
.toast{background:var(--navy-1);color:#f3f6fa}
.toast button{color:#c8d2e0}
@media all{
  .tabs button[aria-pressed="true"],.go,.btn-main,.group h2 small,.row.checked .check{background:linear-gradient(180deg,#f4f7fa 0%,#cdd5df 100%);color:#0a1630;border-color:transparent;text-shadow:none}
  .check{background:transparent}
}

/* ===== 背景は黒。ヘッド・タブ・カードの色を、すべて＝シルバー／本業＝オレンジ／副業＝ロイヤルブルー ===== */
:root{ --bg:#050506; --hon:#ffb36b; --fuku:#a9c3ff; }
body{ background:#050506;
  --hero:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),linear-gradient(125deg,#2a3037 0%,#5b646e 24%,#30363d 48%,#6a737d 70%,#22272c 100%);
  --act:linear-gradient(180deg,#f7f9fb 0%,#c9d1db 45%,#8e9aaa 100%); --act-ink:#0a1630;
  --card:linear-gradient(180deg,#3b4149 0%,#262a30 100%); --card-line:rgba(255,255,255,.16) }
body[data-tab="本業"]{
  --hero:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.16) 0%,transparent 55%),linear-gradient(155deg,#ea7a22 0%,#a9440a 55%,#5e2204 100%);
  --act:linear-gradient(180deg,#f39237 0%,#c2530c 100%); --act-ink:#ffffff;
  --card:linear-gradient(180deg,#a8480f 0%,#6e2c07 100%); --card-line:rgba(255,190,130,.28) }
body[data-tab="副業"]{
  --hero:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.16) 0%,transparent 55%),linear-gradient(155deg,#2f5fd0 0%,#132f86 55%,#0a1a4f 100%);
  --act:linear-gradient(180deg,#3d6be0 0%,#1c3fae 100%); --act-ink:#ffffff;
  --card:linear-gradient(180deg,#2850b4 0%,#152e74 100%); --card-line:rgba(150,180,255,.3) }
.hero{ background:var(--hero); border-color:var(--card-line) }
.hero .month, .hero .stat span, .brand{ color:rgba(255,255,255,.75) }
.tabs{ background:#121214; border:1px solid #232327; box-shadow:none }
.tabs button{ color:#8d8f96 }
.tabs button[aria-pressed="true"]{ background:var(--act); color:var(--act-ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.35) }
.group h2{ color:#f2f3f5 }
.group h2 small{ background:var(--act); color:var(--act-ink) }
.hint{ color:#9a9ca3 }
.row{ background:var(--card); border:1px solid var(--card-line); box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.4) }
.row .ttl{ color:#ffffff }
.row.checked .ttl{ color:rgba(255,255,255,.6) }
.check{ border-color:rgba(255,255,255,.55); background:rgba(0,0,0,.18) }
.row.checked .check{ background:#ffffff; color:#111; border-color:transparent }
.mark{ background:rgba(0,0,0,.22); color:#ffffff }
.tag, .tag.hon, .tag.fuku, .tag.stage{ background:rgba(0,0,0,.3); }
.tag.hon{ color:var(--hon) } .tag.fuku{ color:var(--fuku) } .tag.stage{ color:rgba(255,255,255,.8) }
.tag.due{ background:rgba(255,255,255,.92); color:#c6362a }
.sub{ color:rgba(255,255,255,.75) }
.go{ background:rgba(255,255,255,.95); color:#111; border:0; box-shadow:0 2px 8px rgba(0,0,0,.3) }
.empty{ border-color:#2a2a2f; color:#8d8f96 }
.toggle{ color:#9a9ca3 }

/* 左スライドで移動 */
.swipe{position:relative;border-radius:18px;overflow:hidden;background:#0d0d10}
.swipe .acts{position:absolute;top:0;right:0;bottom:0;display:flex}
.swipe .mv{width:78px;color:#fff;font-weight:700;font-size:12px;line-height:1.35;white-space:pre-line;display:flex;align-items:center;justify-content:center;text-align:center}
.mv-mine{background:linear-gradient(180deg,#5b646e,#30363d)}
.mv-todo{background:linear-gradient(180deg,#c2530c,#7a3106)}
.mv-ai{background:linear-gradient(180deg,#3d6be0,#1c3fae)}
.swipe .row{position:relative;z-index:1;touch-action:pan-y;transition:transform .22s ease}
.swipe .row.dragging{transition:none}
.swipe-hint{font-size:12px;color:#8d8f96;text-align:center;margin-top:-8px}

.mv-edit{background:linear-gradient(180deg,#f4f6f8,#c9d0d8)!important;color:#111!important}
.due-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.due-row span{flex:none}
.due-row input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg)}
.due-row button{flex:none;font-size:13px;color:var(--muted);padding:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.go-sub{background:rgba(0,0,0,.35)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important}
/* 役割の一覧 */
.menu-sheet .menu-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.menu-item b{font-size:16px}
.menu-item span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid #2a2a2f;background:#121214;color:#c9ccd2;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:#f2f3f5;color:#111;border-color:transparent}
.role .body{gap:8px}
.role-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.role-top .ttl{flex:1;min-width:0}
.owner-sel{flex:none;font:inherit;font-size:12px;font-weight:700;padding:5px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;max-width:46%}
.role-what{font-size:13px;color:rgba(255,255,255,.85);line-height:1.6}
.role-memo{font-size:12px;color:rgba(255,255,255,.65);border-left:2px solid rgba(255,255,255,.25);padding-left:8px}
.o-claude{color:#f0a27c!important} .o-codex{color:#b9a3ff!important} .o-gpt{color:#5fd3a8!important} .o-work{color:#7cc4f0!important} .o-gemini{color:#9cb8ff!important}
.chip.o-claude[aria-pressed="true"],.chip.o-codex[aria-pressed="true"],.chip.o-gpt[aria-pressed="true"],.chip.o-work[aria-pressed="true"],.chip.o-gemini[aria-pressed="true"]{color:#111!important}

/* 右下の＋・入力シート・お知らせを、いつも一番手前に */
.fab{z-index:40}
.sheet{z-index:50}
.menu-sheet{z-index:55}
.toast{z-index:60}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <div class="brand">TODAY'S BOARD</div>
      <div class="icons">
      <button class="iconbtn" id="menuBtn" type="button" aria-label="メニュー" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="iconbtn" id="speak" type="button" aria-label="自分でやることを読み上げる" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
      <button class="iconbtn" id="reload" type="button" aria-label="最新を読み込む" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
      </button>
      </div>
    </div>
    <div class="hero-date">
      <div class="day" id="dDay"></div>
      <div class="meta"><div class="month" id="dMonth"></div><div class="hero-msg" id="heroMsg">今日のやること</div></div>
    </div>
    <div class="stats" id="stats" hidden>
      <div class="stat"><b id="cMine">0</b><span>自分でやる</span></div>
      <div class="stat"><b id="cTodo">0</b><span>未着手</span></div>
      <div class="stat" id="sAi"><b id="cAi">0</b><span>AI作業中</span></div>
    </div>
  </header>

  <section class="login" id="login" hidden>
    <p>最初の1回だけ、Dropboxにログインしてください。<br>次からはアイコンを押すだけで開きます。</p>
    <button class="btn-main" id="loginBtn" type="button">Dropboxにログインする</button>
  </section>

  <div id="main" hidden>
    <div class="wrap">
      <div class="tabs" role="group" aria-label="表示の切り替え">
        <button type="button" data-f="all">すべて</button>
        <button type="button" data-f="本業">本業</button>
        <button type="button" data-f="副業">副業</button>
      </div>
      <div class="swipe-hint">タスクを左にスライドすると、直したり、ほかの欄へ移したりできます</div>
      <div id="groups"></div>
      <div class="legend"><span><i style="background:var(--hon)"></i>本業</span><span><i style="background:var(--fuku)"></i>副業</span></div>
    </div>
  </div>
  <div id="rolesView" hidden>
    <div class="wrap">
      <div class="chips" id="ownerChips" role="group" aria-label="担当で絞り込む"></div>
      <div class="swipe-hint">ボタンを押すと、その担当に指示を出せます。担当は右上の選択で変えられます</div>
      <div id="roles"></div>
    </div>
  </div>
  <div class="note" id="note"></div>
  <div class="foot"><button type="button" id="logout" hidden>Dropboxからログアウト</button></div>
</div>

<button class="fab" id="fab" type="button" aria-label="タスクを追加" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<form class="sheet" id="sheet" hidden>
  <h3 id="sheetTitle">思いついたことを入れる</h3>
  <input type="text" id="addInput" placeholder="例：〇〇様に見積もりを送る" autocomplete="off" enterkeyhint="done">
  <label class="due-row" for="dueInput"><span>締切（なくてもOK）</span><input type="date" id="dueInput"><button type="button" id="dueClear">消す</button></label>
  <div class="kinds" role="group" aria-label="本業か副業か">
    <button type="button" data-k="本業">本業</button>
    <button type="button" data-k="副業">副業</button>
  </div>
  <div class="kinds who" id="whoRow" role="group" aria-label="誰がやるか">
    <button type="button" data-w="me">自分でやる</button>
    <button type="button" data-w="ai">AIに頼む</button>
  </div>
  <div class="sheet-acts">
    <button type="button" class="btn-sub" id="cancelAdd">やめる</button>
    <button type="submit" class="btn-main" id="addBtn">入れる</button>
  </div>
</form>

<div class="sheet menu-sheet" id="menuSheet" hidden>
  <h3>メニュー</h3>
  <button type="button" class="menu-item" data-view="board"><b>今日のやること</b><span>進み具合ボード</span></button>
  <button type="button" class="menu-item" data-view="roles"><b>役割の一覧</b><span>Claude・Codex・ChatGPTのだれが何を担当しているか</span></button>
  <button type="button" class="btn-sub" id="menuClose">閉じる</button>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span><button type="button" id="undo" hidden>取り消す</button></div>

<script>
(function(){
  "use strict";
  // ===== 設定 =====
  const APP_KEY = "vd8fz3wp1wvfvxt";
  const PATH = "/AI_Knowledge/06_プロジェクト/00_進み具合ボード.md";
  const REDIRECT = location.origin + location.pathname;
  const STAGE_RE = /^[⓪①②③④⑤⑥⑦⑧⑨⑩]/;
  const AI_LABEL = { "②":"依頼待ち（まだ始まっていません）", "③":"Codexが作業中", "④":"Claudeがチェック中" };

  const $ = id => document.getElementById(id);
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
    set(k,v){ try { localStorage.setItem(k, v); } catch(e) {} },
    del(k){ try { localStorage.removeItem(k); } catch(e) {} }
  };

  let boardText = store.get("board_cache") || "";
  let boardRev = null;
  let busy = false, showDone = false, pending = null;
  let filter = store.get("filter") || "all";
  let addKind = store.get("addKind") || "副業";
  let addWho = "me";

  const pad = n => String(n).padStart(2, "0");
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  $("dDay").textContent = String(now.getDate());
  $("dMonth").textContent = `${now.getMonth()+1}月 ・ ${"日月火水木金土"[now.getDay()]}曜日`;

  // ===== Dropboxとのつなぎ（ログイン） =====
  function b64url(bytes){
    let s = ""; bytes.forEach(b => s += String.fromCharCode(b));
    return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function randomString(){ const a = new Uint8Array(48); crypto.getRandomValues(a); return b64url(a); }
  async function challengeOf(v){ const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)); return b64url(new Uint8Array(h)); }

  async function startLogin(){
    const verifier = randomString();
    store.set("pkce_verifier", verifier);
    const params = new URLSearchParams({
      client_id: APP_KEY, response_type: "code", redirect_uri: REDIRECT,
      code_challenge: await challengeOf(verifier), code_challenge_method: "S256",
      token_access_type: "offline"
    });
    location.href = "https://www.dropbox.com/oauth2/authorize?" + params.toString();
  }

  async function finishLoginIfReturning(){
    const q = new URLSearchParams(location.search);
    if (q.get("error")) { history.replaceState(null, "", REDIRECT); setNote("ログインが中止されました。もう一度お試しください", true); return; }
    const code = q.get("code");
    if (!code) return;
    history.replaceState(null, "", REDIRECT);
    const verifier = store.get("pkce_verifier");
    if (!verifier) { setNote("ログインの途中で情報が消えました。もう一度ログインしてください", true); return; }
    const res = await fetch("https://api.dropboxapi.com/oauth2/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ code, grant_type: "authorization_code", client_id: APP_KEY, redirect_uri: REDIRECT, code_verifier: verifier })
    });
    store.del("pkce_verifier");
    if (!res.ok) { setNote("ログインがうまくいきませんでした。もう一度お試しください", true); return; }
    saveToken(await res.json());
  }

  function saveToken(t){
    if (t.access_token) { store.set("dbx_access", t.access_token); store.set("dbx_exp", String(Date.now() + (t.expires_in || 14400) * 1000)); }
    if (t.refresh_token) store.set("dbx_refresh", t.refresh_token);
  }
  const loggedIn = () => !!store.get("dbx_refresh");

  async function accessToken(force){
    const exp = +(store.get("dbx_exp") || 0);
    if (!force && store.get("dbx_access") && exp - Date.now() > 60000) return store.get("dbx_access");
    const refresh = store.get("dbx_refresh");
    if (!refresh) throw { kind: "login" };
    const res = await fetch("https://api.dropboxapi.com/oauth2/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ grant_type: "refresh_token", refresh_token: refresh, client_id: APP_KEY })
    });
    if (res.status === 400 || res.status === 401) { logout(true); throw { kind: "login" }; }
    if (!res.ok) throw { kind: "net" };
    saveToken(await res.json());
    return store.get("dbx_access");
  }

  // ヘッダーに日本語を入れるときは \uXXXX の形にする必要がある
  const headerJson = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => "\\u" + ("000" + c.charCodeAt(0).toString(16)).slice(-4));

  async function dbx(url, arg, body, retried){
    let token;
    try { token = await accessToken(false); } catch(e) { throw e; }
    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        headers: Object.assign({ "Authorization": "Bearer " + token, "Dropbox-API-Arg": headerJson(arg) }, body != null ? { "Content-Type": "application/octet-stream" } : {}),
        body: body != null ? new TextEncoder().encode(body) : undefined
      });
    } catch(e) { throw { kind: "net" }; }
    if (res.status === 401 && !retried) { await accessToken(true); return dbx(url, arg, body, true); }
    return res;
  }

  async function download(path){
    const res = await dbx("https://content.dropboxapi.com/2/files/download", { path: path || PATH }, null);
    if (res.status === 409) throw { kind: "missing" };
    if (!res.ok) throw { kind: "net" };
    let rev = null;
    try { rev = JSON.parse(res.headers.get("Dropbox-API-Result") || "{}").rev || null; } catch(e) {}
    const text = (await res.text()).replace(/\r/g, "").replace(/\s+$/, "") + "\n";
    return { text, rev };
  }

  async function upload(text, rev, path){
    const mode = rev ? { ".tag": "update", "update": rev } : { ".tag": "overwrite" };
    const res = await dbx("https://content.dropboxapi.com/2/files/upload", { path: path || PATH, mode, autorename: false, mute: true }, text);
    if (res.status === 409) throw { kind: "conflict" };
    if (!res.ok) throw { kind: "net" };
    const meta = await res.json();
    return meta.rev || null;
  }

  function logout(silent){
    ["dbx_access","dbx_exp","dbx_refresh","board_cache","roles_cache"].forEach(k => store.del(k));
    boardText = ""; boardRev = null;
    if (!silent) setNote("ログアウトしました");
    show();
  }

  // ===== ボードを読む =====
  function parseItem(raw){
    const parts = raw.replace(/^\s*-\s/, "").split("｜");
    let title = parts[0].trim(), kind = null;
    const m = title.match(/^【(本業|副業)】\s*/);
    if (m) { kind = m[1]; title = title.slice(m[0].length); }
    const fields = {}, extra = [];
    parts.slice(1).forEach(p => { const mm = p.match(/^\s*([^：:]{1,8})[：:]\s*(.*)$/); if (mm) fields[mm[1].trim()] = mm[2].trim(); else if (p.trim()) extra.push(p.trim()); });
    return { raw, kind, title, fields, extra };
  }
  function parse(text){
    const sections = []; let cur = null;
    text.split("\n").forEach(ln => {
      if (ln.startsWith("## ")) { cur = { title: ln.slice(3).trim(), items: [] }; sections.push(cur); }
      else if (cur && /^\s*-\s/.test(ln)) cur.items.push(parseItem(ln));
    });
    return sections.filter(s => STAGE_RE.test(s.title));
  }
  function dueInfo(v){
    const m = (v||"").match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if (!m) return null;
    const d = Math.round((new Date(+m[1],+m[2]-1,+m[3]) - new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
    const md = `${+m[2]}月${+m[3]}日`;
    if (d < 0) return `${md}締切（${-d}日過ぎ）`;
    if (d === 0) return "今日締切";
    if (d === 1) return "明日締切";
    return `${md}締切`;
  }
  const sym = s => s.title.charAt(0);
  const isDone = s => s.title.includes("完了");
  const isMine = s => sym(s) === "⓪" || s.title.includes("恒松さん");

  function grouped(){
    const pass = it => filter === "all" || it.kind === filter;
    const mine = [], todo = [], ai = [], done = [];
    parse(boardText).forEach(s => s.items.filter(pass).forEach(it => {
      if (isDone(s)) done.push({ it });
      else if (isMine(s)) mine.push({ it, stage: sym(s) === "⓪" ? null : "確認してね" });
      else if (sym(s) === "①") todo.push({ it, stage: null });
      else ai.push({ it, stage: AI_LABEL[sym(s)] || s.title.replace(STAGE_RE,"").replace(/（.*?）/g,"").trim() });
    }));
    const byDue = (a,b) => (a.it.fields["締切"]||"9999").localeCompare(b.it.fields["締切"]||"9999");
    mine.sort(byDue); todo.sort(byDue); ai.sort(byDue); done.reverse();
    return { mine, todo, ai, done };
  }

  // ===== 画面 =====
  function el(tag, attrs, kids){
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k === "cls") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (kids||[]).forEach(c => c && e.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return e;
  }
  const SPARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function row(it, opts){
    const k = it.kind === "本業" ? "hon" : it.kind === "副業" ? "fuku" : "none";
    const r = el("div", { cls: "row" + (opts.done || (pending && pending.raw === it.raw) ? " checked" : "") });
    if (opts.checkable) {
      const b = el("button", { cls:"check", type:"button", "aria-label":"「"+it.title+"」を完了にする" });
      b.innerHTML = CHECK; b.disabled = busy || !!pending;
      b.onclick = () => startComplete(it);
      r.appendChild(b);
    } else if (opts.done) {
      const c = el("span", { cls:"check" }); c.innerHTML = CHECK; r.appendChild(c);
    } else {
      const m = el("span", { cls:"mark" }); m.innerHTML = SPARK; r.appendChild(m);
    }
    const body = el("div", { cls:"body" }, [ el("div", { cls:"ttl", text: it.title }) ]);
    const sub = el("div",{cls:"sub"});
    if (it.kind) sub.appendChild(el("span",{cls:"tag "+k,text:it.kind}));
    if (!opts.done) { const d = dueInfo(it.fields["締切"]); if (d) sub.appendChild(el("span",{cls:"tag due",text:d})); }
    if (opts.stage) sub.appendChild(el("span",{cls:"tag stage",text:opts.stage}));
    if (opts.done) { const w = it.fields["完了"] || it.extra.join(" "); const m = w.match(/\d{4}-0?(\d+)-0?(\d+)/); sub.appendChild(document.createTextNode(m ? `${m[1]}/${m[2]} 完了` : w)); }
    if (sub.childNodes.length) body.appendChild(sub);
    // 作業中のチャットへのリンク（ボードに「｜リンク：https://…」と書かれているとき）
    const link = (it.fields["リンク"] || "").trim();
    if (/^https:\/\/claude\.ai\//.test(link)) {
      body.appendChild(el("a", { cls:"go", href: link, target:"_blank", rel:"noopener", text:"Claudeのチャットを開く →" }));
    } else if (/^https:\/\/mail\.google\.com\//.test(link)) {
      body.appendChild(el("a", { cls:"go", href: link, target:"_blank", rel:"noopener", text:"Gmailでメールを開く →" }));
    } else if (opts.ask || opts.stage === AI_LABEL["②"]) {
      const line = it.raw.replace(/^\s*-\s/, "");
      const msg = `進み具合ボード（Dropbox /AI_Knowledge/06_プロジェクト/00_進み具合ボード.md）のこのタスクを進めてください。始めるときは、ボードのこの行の最後に「｜リンク：（このチャットのURL）」を書いてください。\n${line}`;
      const btns = el("div", { cls:"btns" });
      btns.appendChild(el("a", { cls:"go", href: "https://claude.ai/new?q=" + encodeURIComponent(msg), target:"_blank", rel:"noopener", text:"Claudeへ作業依頼 →" }));
      if (!opts.ask) {
        const letter = "【Claudeからのお手紙】\n■恒松さんがすること：このお手紙をCodexに貼るだけです。\n■Codexがすること：\n進み具合ボード（Dropbox /AI_Knowledge/06_プロジェクト/00_進み具合ボード.md）の次のタスクを進めてください。作業の前に /AI_Knowledge/AGENTS.md を読んでください。\n" + line + "\n始めるときにボードのこの行を「## ③ Codex作業中」へ移し、終わったら「## ④ Claudeのチェック待ち」へ移してください。\n返信不要";
        const cb = el("button", { cls:"go go-sub", type:"button", text:"Codexへのお手紙をコピー" });
        cb.onclick = async e => {
          e.stopPropagation();
          try { await navigator.clipboard.writeText(letter); toast("コピーしました。Codexに貼り付けてください", null, 3200); }
          catch(_) { toast("コピーできませんでした。もう一度押してください", null, 3200); }
        };
        btns.appendChild(cb);
      }
      body.appendChild(btns);
    }
    // 行のどこを押しても、ボタンと同じ飛び先を開く
    const go = body.querySelector("a.go");
    // （Codexのコピーボタンを押したときは、行のタップ扱いにしない）
    if (go) { body.classList.add("tap"); body.onclick = e => { if (e.target !== go && !e.target.closest("button")) go.click(); }; }
    r.appendChild(body);
    return r;
  }
  function group(title, items, opts){
    const g = el("section", { cls:"group" }, [ el("h2", {}, [ title, el("small",{text:String(items.length)}) ]) ]);
    if (opts.hint && items.length) g.appendChild(el("div", { cls:"hint", text: opts.hint }));
    const list = el("div", { cls:"list" });
    if (!items.length) list.appendChild(el("div", { cls:"empty", text: "今はありません" }));
    items.forEach(x => {
      const r = row(x.it, Object.assign({}, opts, { stage: x.stage }));
      list.appendChild(opts.key ? swipeWrap(r, x.it, opts.key) : r);
    });
    g.appendChild(list);
    return g;
  }
  // ===== 左にスライドして移動 =====
  const MOVE_TO = {
    mine: { sym:"⓪", label:"自分で\nやる", cls:"mv-mine", msg:"自分でやることに移しました" },
    todo: { sym:"①", label:"まだ\n手つかず", cls:"mv-todo", msg:"まだ手をつけていないに移しました" },
    ai:   { sym:"②", label:"AIに\n任せる", cls:"mv-ai", msg:"AIに任せたことに移しました。ボタンで依頼すると始まります" }
  };
  let openRow = null, suppressClick = false;
  function closeOpen(){ if (openRow) { openRow.style.transform = ""; openRow.classList.remove("open"); openRow = null; } }
  function swipeWrap(r, it, key){
    const targets = Object.keys(MOVE_TO).filter(k => k !== key);
    const W = 78 * (targets.length + 1);
    const acts = el("div", { cls:"acts" });
    const eb = el("button", { cls:"mv mv-edit", type:"button", text:"編集" });
    eb.disabled = busy || !!pending;
    eb.onclick = () => { closeOpen(); openSheet(true, it); };
    acts.appendChild(eb);
    targets.forEach(k => {
      const t = MOVE_TO[k];
      const b = el("button", { cls:"mv " + t.cls, type:"button", text: t.label });
      b.disabled = busy || !!pending;
      b.onclick = () => { closeOpen(); moveTask(it, t); };
      acts.appendChild(b);
    });
    const wrap = el("div", { cls:"swipe" }, [acts, r]);
    let sx = 0, sy = 0, dx = 0, base = 0, drag = false, decided = false;
    r.addEventListener("pointerdown", e => {
      if (openRow && openRow !== r) closeOpen();
      sx = e.clientX; sy = e.clientY; dx = 0; drag = true; decided = false;
      base = r.classList.contains("open") ? -W : 0;
    });
    r.addEventListener("pointermove", e => {
      if (!drag) return;
      const mx = e.clientX - sx, my = e.clientY - sy;
      if (!decided) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        decided = true;
        if (Math.abs(my) > Math.abs(mx)) { drag = false; return; }
        r.classList.add("dragging");
        try { r.setPointerCapture(e.pointerId); } catch(_) {}
      }
      dx = Math.min(0, Math.max(-W - 24, base + mx));
      r.style.transform = `translateX(${dx}px)`;
    });
    const end = () => {
      if (!drag) return; drag = false;
      if (!decided) return;
      r.classList.remove("dragging");
      suppressClick = true; setTimeout(() => suppressClick = false, 60);
      if (dx < -W / 2) { r.style.transform = `translateX(${-W}px)`; r.classList.add("open"); openRow = r; }
      else { r.style.transform = ""; r.classList.remove("open"); if (openRow === r) openRow = null; }
    };
    r.addEventListener("pointerup", end);
    r.addEventListener("pointercancel", end);
    r.addEventListener("click", e => {
      if (suppressClick || r.classList.contains("open")) {
        e.stopPropagation(); e.preventDefault();
        if (!suppressClick) closeOpen();
      }
    }, true);
    return wrap;
  }
  function moveTask(it, t){
    mutate(lines => {
      const i = lines.findIndex(l => l === it.raw); if (i < 0) return false;
      lines.splice(i, 1);
      return insertInto(lines, title => title.startsWith(t.sym), it.raw);
    }, t.msg);
  }

  function render(){
    openRow = null;
    if (!boardText) { $("groups").replaceChildren(); $("stats").hidden = true; return; }
    const { mine, todo, ai, done } = grouped();
    document.body.dataset.tab = filter;
        $("stats").hidden = false;
    $("cMine").textContent = mine.length; $("cTodo").textContent = todo.length; $("cAi").textContent = ai.length;
    $("sAi").classList.toggle("hot", ai.length > 0);
    $("heroMsg").textContent = mine.length ? `自分でやることが${mine.length}件` : "自分でやることはなし";
    document.querySelectorAll(".tabs button").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.f === filter)));
    const dg = el("section", { cls:"group" });
    const t = el("button", { cls:"toggle", type:"button", text: (showDone ? "▾ " : "▸ ") + `終わったこと（${done.length}件）` });
    t.onclick = () => { showDone = !showDone; render(); };
    dg.appendChild(t);
    if (showDone) {
      const list = el("div",{cls:"list"});
      if (!done.length) list.appendChild(el("div",{cls:"empty",text:"まだありません"}));
      done.forEach(x => list.appendChild(row(x.it,{done:true})));
      dg.appendChild(list);
    }
    $("groups").replaceChildren(group("自分でやること", mine, { checkable:true, key:"mine" }), group("まだ手をつけていない", todo, { checkable:true, ask:true, key:"todo", hint:"「Claudeへ作業依頼」を押すと、Claudeのチャットが開きます" }), group("AIに任せたこと", ai, { key:"ai", hint:"「依頼待ち」は、ボタンでClaudeかCodexに頼むと作業が始まります" }), dg);
  }
  function show(){
    const ok = loggedIn();
    const roles = view === "roles";
    $("login").hidden = ok; $("main").hidden = !ok || roles; $("rolesView").hidden = !ok || !roles;
    $("fab").hidden = !ok || roles || !$("sheet").hidden;
    $("reload").hidden = !ok; $("logout").hidden = !ok; $("menuBtn").hidden = !ok;
    $("speak").hidden = !ok || roles || !("speechSynthesis" in window);
    render();
    if (roles) {
      document.body.dataset.tab = "all";
      $("stats").hidden = true;
      $("heroMsg").textContent = "役割の一覧";
      document.querySelector(".brand").textContent = "ROLES";
      renderRoles();
    } else {
      document.querySelector(".brand").textContent = "TODAY'S BOARD";
    }
  }
  function setNote(text, err){ const n = $("note"); n.textContent = text || ""; n.className = "note" + (err ? " err" : ""); }
  let toastT;
  function toast(text, undoFn, ms){
    $("toastText").textContent = text; const u = $("undo");
    u.hidden = !undoFn; u.onclick = undoFn || null;
    $("toast").hidden = false; clearTimeout(toastT);
    toastT = setTimeout(() => $("toast").hidden = true, ms || 2400);
  }
  function explain(e){
    const k = e && e.kind;
    if (k === "login") return "Dropboxへのログインが切れました。もう一度ログインしてください";
    if (k === "missing") return "Dropboxに進み具合ボードが見つかりません。Claudeに「ボードを作り直して」と伝えてください";
    if (k === "conflict") return "同じタイミングで誰か（ClaudeかCodex）がボードを書き換えました。最新を読み込んだので、もう一度どうぞ";
    return "Dropboxにつながりませんでした。電波を確認して、右上の矢印でもう一度";
  }
  const stamp = () => { const t = new Date(); return `${pad(t.getHours())}:${pad(t.getMinutes())}`; };

  async function load(){
    if (!loggedIn()) { show(); return; }
    $("reload").classList.add("spin");
    try {
      const r = await download();
      boardText = r.text; boardRev = r.rev; store.set("board_cache", boardText);
      try { const rr = await download(ROLES_PATH); rolesText = rr.text; store.set("roles_cache", rolesText); } catch(_) {}
      setNote(`${stamp()} の最新です`);
    } catch(e) {
      setNote(explain(e) + (boardText ? "（前回の内容を表示中）" : ""), true);
    }
    $("reload").classList.remove("spin");
    show();
  }


  // ===== 役割の一覧 =====
  const ROLES_PATH = "/AI_Knowledge/06_プロジェクト/00_役割一覧.md";
  const OWNERS = ["Claude", "Codex", "ChatGPT", "ChatGPT Work", "Gemini"];
  const OWNER_CLS = { "Claude":"o-claude", "Codex":"o-codex", "ChatGPT":"o-gpt", "ChatGPT Work":"o-work", "Gemini":"o-gemini" };
  let rolesText = store.get("roles_cache") || "";
  let ownerFilter = store.get("ownerFilter") || "all";
  let view = location.hash === "#roles" ? "roles" : "board";
  function setView(v){
    view = v;
    try { history.replaceState(null, "", v === "roles" ? "#roles" : location.pathname); } catch(_) {}
    $("menuSheet").hidden = true;
    show(); window.scrollTo(0, 0);
  }
  function parseRoles(text){
    const secs = []; let cur = null;
    text.split("\n").forEach(ln => {
      if (ln.startsWith("## ")) { cur = { title: ln.slice(3).trim(), items: [] }; secs.push(cur); }
      else if (cur && /^\s*-\s【/.test(ln)) {
        const parts = ln.replace(/^\s*-\s/, "").split("｜");
        const m = parts[0].match(/^【([^】]+)】\s*(.*)$/); if (!m) return;
        const f = {}; parts.slice(1).forEach(p => { const mm = p.match(/^\s*([^：:]{1,6})[：:]\s*(.*)$/); if (mm) f[mm[1].trim()] = mm[2].trim(); });
        cur.items.push({ raw: ln, owner: m[1].trim(), name: m[2].trim(), when: f["いつ"] || "", what: f["内容"] || "", memo: f["メモ"] || "" });
      }
    });
    return secs.filter(x => x.items.length && !x.title.startsWith("ルール"));
  }
  function instruction(r){
    return `「${r.name}」について指示です（担当：${r.owner}）。\n今の設定：${r.when ? "いつ " + r.when + "／" : ""}${r.what}\n\nお願いしたいこと：`;
  }
  function actionFor(r){
    const q = encodeURIComponent(instruction(r));
    if (r.owner === "Claude") return el("a", { cls:"go", href:"https://claude.ai/new?q=" + q, target:"_blank", rel:"noopener", text:"Claudeに指示する →" });
    if (r.owner === "ChatGPT" || r.owner === "ChatGPT Work") return el("a", { cls:"go", href:"https://chatgpt.com/?q=" + q, target:"_blank", rel:"noopener", text: r.owner + "に指示する →" });
    if (r.owner === "Gemini") return el("a", { cls:"go", href:"https://gemini.google.com/app", target:"_blank", rel:"noopener", text:"Geminiを開く →" });
    const b = el("button", { cls:"go", type:"button", text:"Codexへの指示をコピー" });
    b.onclick = async () => {
      const letter = "【Claudeからのお手紙】\n■恒松さんがすること：このお手紙をCodexに貼るだけです。\n■Codexがすること：\n" + instruction(r);
      try { await navigator.clipboard.writeText(letter); toast("コピーしました。PCのCodexに貼り付けてください", null, 3200); }
      catch(_) { toast("コピーできませんでした。もう一度押してください", null, 3200); }
    };
    return b;
  }
  function renderRoles(){
    const box = $("roles");
    if (!rolesText) { box.replaceChildren(el("div", { cls:"empty", text:"役割の一覧を読み込み中です。右上の矢印で読み込み直せます" })); $("ownerChips").replaceChildren(); return; }
    const secs = parseRoles(rolesText);
    const all = secs.flatMap(x => x.items);
    const chips = ["all", ...OWNERS.filter(o => all.some(r => r.owner === o))];
    $("ownerChips").replaceChildren(...chips.map(o => {
      const n = o === "all" ? all.length : all.filter(r => r.owner === o).length;
      const b = el("button", { type:"button", cls:"chip " + (OWNER_CLS[o] || ""), "aria-pressed": String(ownerFilter === o), text: (o === "all" ? "すべて" : o) + " " + n });
      b.onclick = () => { ownerFilter = o; store.set("ownerFilter", o); renderRoles(); };
      return b;
    }));
    box.replaceChildren(...secs.map(sec => {
      const items = sec.items.filter(r => ownerFilter === "all" || r.owner === ownerFilter);
      const g = el("section", { cls:"group" }, [ el("h2", {}, [ sec.title.replace(/（.*?）/g, ""), el("small", { text:String(items.length) }) ]) ]);
      const list = el("div", { cls:"list" });
      if (!items.length) list.appendChild(el("div", { cls:"empty", text:"今はありません" }));
      items.forEach(r => {
        const sel = el("select", { cls:"owner-sel " + (OWNER_CLS[r.owner] || ""), "aria-label":"「" + r.name + "」の担当" });
        OWNERS.forEach(o => { const op = el("option", { value:o, text:o }); if (o === r.owner) op.selected = true; sel.appendChild(op); });
        sel.disabled = busy;
        sel.onchange = () => changeOwner(r, sel.value);
        const body = el("div", { cls:"body" }, [
          el("div", { cls:"role-top" }, [ el("div", { cls:"ttl", text:r.name }), sel ]),
        ]);
        const sub = el("div", { cls:"sub" });
        if (r.when) sub.appendChild(el("span", { cls:"tag stage", text:r.when }));
        if (sub.childNodes.length) body.appendChild(sub);
        if (r.what) body.appendChild(el("div", { cls:"role-what", text:r.what }));
        if (r.memo) body.appendChild(el("div", { cls:"role-memo", text:"メモ：" + r.memo }));
        body.appendChild(actionFor(r));
        list.appendChild(el("div", { cls:"row role" }, [ body ]));
      });
      g.appendChild(list);
      return g;
    }));
  }
  async function changeOwner(r, to){
    if (busy || to === r.owner) return;
    busy = true; setNote("保存中…");
    try {
      const fresh = await download(ROLES_PATH);
      const lines = fresh.text.split("\n");
      const i = lines.findIndex(l => l === r.raw);
      if (i < 0) { rolesText = fresh.text; setNote("一覧が変わっていたので最新にしました。もう一度どうぞ", true); }
      else {
        lines[i] = r.raw.replace(/【[^】]+】/, `【${to}】`);
        const text = lines.join("\n").replace(/\s+$/, "") + "\n";
        await upload(text, fresh.rev, ROLES_PATH);
        rolesText = text; store.set("roles_cache", text);
        setNote(`${stamp()} に保存しました`); toast(`担当を${to}にしました`);
      }
    } catch(e) { setNote(explain(e), true); }
    busy = false; renderRoles();
  }

  // ===== ボードに書く =====
  function insertInto(lines, test, newLine){
    const h = lines.findIndex(l => l.startsWith("## ") && test(l.slice(3).trim()));
    if (h < 0) return false;
    let end = lines.length;
    for (let i=h+1;i<lines.length;i++) if (lines[i].startsWith("## ")) { end = i; break; }
    let pos = h + 1;
    for (let i=h+1;i<end;i++) if (/^\s*-\s/.test(lines[i])) pos = i + 1;
    lines.splice(pos, 0, newLine);
    return true;
  }
  async function mutate(change, okMsg){
    if (busy) return false;
    busy = true; render(); setNote("保存中…");
    let ok = false;
    try {
      const fresh = await download();
      const lines = fresh.text.split("\n");
      if (!change(lines)) {
        boardText = fresh.text; boardRev = fresh.rev; store.set("board_cache", boardText);
        setNote("ボードが変わっていたので最新にしました。もう一度どうぞ", true);
      } else {
        const newText = lines.join("\n").replace(/\s+$/, "") + "\n";
        boardRev = await upload(newText, fresh.rev);
        boardText = newText; store.set("board_cache", boardText); ok = true;
        setNote(`${stamp()} に保存しました`);
        toast(okMsg);
      }
    } catch(e) {
      setNote(explain(e), true);
      if (e && e.kind === "conflict") { try { const r = await download(); boardText = r.text; boardRev = r.rev; store.set("board_cache", boardText); } catch(_) {} }
    }
    busy = false; render(); return ok;
  }
  function startComplete(it){
    if (pending || busy) return;
    pending = { raw: it.raw };
    render();
    toast("完了にしました", () => { clearTimeout(pending.timer); pending = null; $("toast").hidden = true; render(); }, 3500);
    pending.timer = setTimeout(async () => {
      const raw = pending.raw;
      await mutate(lines => {
        const i = lines.findIndex(l => l === raw); if (i < 0) return false;
        lines.splice(i, 1);
        return insertInto(lines, t => t.includes("完了"), raw.replace(/\s+$/,"") + `｜完了：${todayStr}`);
      }, "Dropboxに記録しました");
      pending = null; render();
    }, 3500);
  }

  // ===== 読み上げ =====
  let speaking = false;
  function speakToday(){
    const ss = window.speechSynthesis;
    if (speaking) { ss.cancel(); speaking = false; $("speak").classList.remove("on"); return; }
    const { mine, todo, ai } = grouped();
    let text = mine.length ? `自分でやることは${mine.length}件です。` : "自分でやることは、今はありません。";
    mine.forEach((x, i) => { const d = dueInfo(x.it.fields["締切"]); text += `${i+1}つ目、${x.it.title}${d ? "、" + d : ""}。`; });
    if (todo.length) text += `まだ手をつけていないことが${todo.length}件あります。`;
    if (ai.length) text += `AIが作業中のことは${ai.length}件です。`;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 1.0;
    const v = ss.getVoices().find(v => v.lang && v.lang.startsWith("ja"));
    if (v) u.voice = v;
    u.onend = u.onerror = () => { speaking = false; $("speak").classList.remove("on"); };
    ss.cancel(); ss.speak(u); speaking = true; $("speak").classList.add("on");
  }

  // ===== ボタン =====
  let editing = null;
  function openSheet(open, it){
    if (open && it !== undefined) {
      editing = it;
      if (it) {
        $("addInput").value = it.title;
        if (it.kind) addKind = it.kind;
        const m = (it.fields["締切"] || "").match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
        $("dueInput").value = m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : "";
      }
    }
    if (!open) { if (editing) { $("addInput").value = ""; $("dueInput").value = ""; } editing = null; }
    $("sheetTitle").textContent = editing ? "タスクを直す" : "思いついたことを入れる";
    $("addBtn").textContent = editing ? "保存する" : "入れる";
    $("whoRow").hidden = !!editing;
    $("sheet").hidden = !open; $("fab").hidden = open || !loggedIn();
    document.querySelectorAll(".kinds button[data-k]").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.k === addKind)));
    document.querySelectorAll(".kinds button[data-w]").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.w === addWho)));
    if (open) setTimeout(() => $("addInput").focus(), 50);
  }
  $("menuBtn").onclick = () => { $("menuSheet").hidden = !$("menuSheet").hidden; };
  $("menuClose").onclick = () => { $("menuSheet").hidden = true; };
  document.querySelectorAll(".menu-item").forEach(b => b.onclick = () => setView(b.dataset.view));
  window.addEventListener("hashchange", () => { const v = location.hash === "#roles" ? "roles" : "board"; if (v !== view) { view = v; show(); } });
  $("loginBtn").onclick = () => startLogin();
  $("logout").onclick = () => logout(false);
  $("speak").onclick = () => speakToday();
  $("reload").onclick = () => { if (!busy && !pending) load(); };
  $("fab").onclick = () => openSheet(true, null);
  $("dueClear").onclick = e => { e.preventDefault(); $("dueInput").value = ""; };
  $("cancelAdd").onclick = () => openSheet(false);
  document.querySelectorAll(".kinds button[data-k]").forEach(c => c.onclick = () => { addKind = c.dataset.k; store.set("addKind", addKind); openSheet(true); });
  document.querySelectorAll(".kinds button[data-w]").forEach(c => c.onclick = () => { addWho = c.dataset.w; openSheet(true); });
  document.querySelectorAll(".tabs button").forEach(c => c.onclick = () => { filter = c.dataset.f; store.set("filter", filter); render(); });
  $("sheet").addEventListener("submit", async e => {
    e.preventDefault();
    const v = $("addInput").value.replace(/[｜\n]/g, " ").trim();
    if (!v) { $("addInput").focus(); return; }
    $("addBtn").disabled = true;
    const due = $("dueInput").value; // YYYY-MM-DD か空
    let ok;
    if (editing) {
      const raw = editing.raw;
      ok = await mutate(lines => {
        const i = lines.findIndex(l => l === raw); if (i < 0) return false;
        const indent = (raw.match(/^\s*/) || [""])[0];
        const rest = raw.replace(/^\s*-\s/, "").split("｜").slice(1).filter(p => !/^\s*締切[：:]/.test(p));
        if (due) rest.unshift(`締切：${due}`);
        lines[i] = `${indent}- 【${addKind}】${v}` + (rest.length ? "｜" + rest.join("｜") : "");
        return true;
      }, "直しました");
    } else {
      const toMe = addWho === "me";
      const dueText = due ? `｜締切：${due}` : "";
      ok = await mutate(lines => insertInto(lines, t => t.startsWith(toMe ? "⓪" : "①"), `- 【${addKind}】${v}${dueText}｜登録：${todayStr}`), toMe ? "自分でやることに入れました" : "まだ手をつけていないに入れました");
    }
    $("addBtn").disabled = false;
    if (ok) { $("addInput").value = ""; $("dueInput").value = ""; addWho = "me"; openSheet(false); }
  });
  // アプリに戻ってきたら最新を読み込む
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && loggedIn() && !busy && !pending) load(); });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});

  // ===== 起動 =====
  show();
  if (boardText) setNote("前回の内容を表示中…");
  finishLoginIfReturning().catch(() => setNote("ログインがうまくいきませんでした。もう一度お試しください", true)).then(load);
})();
</script>
</body>
</html>
